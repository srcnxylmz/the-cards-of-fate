name: iOS and narrative quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/validate-content.test.mjs
      - run: node tools/validate-content.mjs
      - run: swift test
      - name: Compare three strategies over 10000 seeds each
        run: |
          swift run -c release FateSimulation 10000 --policy random --output docs/simulation-random.json
          swift run -c release FateSimulation 10000 --policy survival --output docs/simulation-survival.json
          swift run -c release FateSimulation 10000 --policy knowledge --output docs/simulation-knowledge.json
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone simulator app
        run: xcodebuild -project TheCardsOfFate.xcodeproj -scheme TheCardsOfFate -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            docs/content-report.json
            docs/simulation-*.json
