name: iOS and narrative quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_only:
        description: 'Only native UI; requires identical runtime/core at the validated source'
        type: boolean
        default: false
      validated_source:
        description: 'Full SHA with existing core and simulation evidence'
        type: string
        default: ''
      resume_180_checkpoint:
        description: 'Reuse the Swift and first three simulation results from run 44563303267'
        type: boolean
        default: false
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/validate-content.test.mjs tools/content-sync.test.mjs tools/audio-assets.test.mjs tools/art-assets.test.mjs tools/recovery-content.test.mjs tools/city-content.test.mjs tools/stewardship-content.test.mjs tools/balance-content.test.mjs tools/continuity-content.test.mjs tools/civic-work-content.test.mjs tools/production-inputs.test.mjs tools/watershed-content.test.mjs tools/empire-content.test.mjs tools/empire-province-content.test.mjs
      - run: node tools/art-audit.mjs
      - run: node tools/generate-feedback.mjs --check
      - run: node tools/build-content.mjs --check
      - run: node tools/validate-content.mjs
      - name: Guard reuse of existing native evidence
        if: inputs.ui_only == true || inputs.resume_180_checkpoint == true
        env:
          VALIDATED_SOURCE: ${{ inputs.validated_source }}
          RESUME_180: ${{ inputs.resume_180_checkpoint }}
        run: |
          [[ "$VALIDATED_SOURCE" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A validated source SHA is required"; exit 1; }
          if [[ "$RESUME_180" == true && "$VALIDATED_SOURCE" != fa99181fa17daef6a64a411601601ae5af9d6990 ]]; then
            echo "Use the exact source from run 44563303267"
            exit 1
          fi
          git fetch --no-tags origin "$VALIDATED_SOURCE"
          git diff --exit-code "$VALIDATED_SOURCE" HEAD -- App Sources Tests UITests Package.swift cards.json assets project.yml tools
      - name: Run Swift tests
        if: inputs.ui_only != true && inputs.resume_180_checkpoint != true
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot an available iPhone
        run: |
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list --json > artifacts/simulator-inventory.json
          python3 tools/select-simulator.py | tee artifacts/selected-simulator.txt
      - name: Build iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -project TheCardsOfFate.xcodeproj -scheme TheCardsOfFate -sdk iphonesimulator -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath .build-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee artifacts/build.log
      - name: Install and launch the real app
        run: |
          xcrun simctl install "$SIMULATOR_UDID" .build-ios/Build/Products/Debug-iphonesimulator/TheCardsOfFate.app
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" games.monkeybonkey.thecardsoffate --ui-testing --reset-ui-test-save -language tr | tee artifacts/launch.log
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot artifacts/installed-launch.png
      - name: Exercise UI and persistence in Turkish and English
        run: |
          set -o pipefail
          xcodebuild -project TheCardsOfFate.xcodeproj -scheme TheCardsOfFate -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath .build-ios -resultBundlePath artifacts/UITests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee artifacts/ui-tests.log
      - name: Export screenshots and simulator diagnostics
        if: always()
        run: |
          mkdir -p artifacts/screenshots artifacts/crashes artifacts/test-runner-crashes
          if [ -d artifacts/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/UITests.xcresult --output-path artifacts/screenshots || echo "Attachment export failed; inspect full xcresult" >> artifacts/export-errors.txt
          fi
          if [ -n "$SIMULATOR_UDID" ]; then
            DATA_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_UDID" games.monkeybonkey.thecardsoffate data)
            if [ -f "$DATA_CONTAINER/Documents/ui-audio-evidence.json" ]; then
              cp "$DATA_CONTAINER/Documents/ui-audio-evidence.json" artifacts/audio-playback.json
            else
              echo "Persistent audio evidence absent" >> artifacts/export-errors.txt
            fi
            xcrun simctl io "$SIMULATOR_UDID" screenshot artifacts/final-screen.png || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 15m --info --style compact --predicate 'process == "TheCardsOfFate"' > artifacts/app-system.log 2>&1 || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -type f -name '*TheCardsOfFate*' -exec cp {} artifacts/crashes/ \; 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f -name '*FateUITests*' -exec cp {} artifacts/test-runner-crashes/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-ui-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && inputs.ui_only != true
        with:
          name: quality-reports
          path: docs/content-report.json
  simulations:
    if: inputs.ui_only != true
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.resume_180_checkpoint && '["knowledge","progression","recovery"]' || '["short","knowledge","progression","recovery"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard reuse of the first three native simulation reports
        if: inputs.resume_180_checkpoint == true
        env:
          VALIDATED_SOURCE: ${{ inputs.validated_source }}
        run: |
          [[ "$VALIDATED_SOURCE" == fa99181fa17daef6a64a411601601ae5af9d6990 ]] || exit 1
          git fetch --no-tags origin "$VALIDATED_SOURCE"
          git diff --exit-code "$VALIDATED_SOURCE" HEAD -- Sources Package.swift cards.json tools
      - name: Compile the macOS simulation executable
        run: swift build -c release --product FateSimulation
      - name: Simulate 10000 seeds per policy
        env:
          POLICY_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p artifacts/native-simulations
          output=artifacts/native-simulations
          if [[ "$POLICY_GROUP" == short ]]; then
            .build/release/FateSimulation 10000 --policy random --output "$output/simulation-random.json" & random_pid=$!
            .build/release/FateSimulation 10000 --policy survival --output "$output/simulation-survival.json" & survival_pid=$!
            .build/release/FateSimulation 10000 --policy survival --manage-council --output "$output/simulation-survival-council.json" & council_pid=$!
            failed=0
            for pid in "$random_pid" "$survival_pid" "$council_pid"; do wait "$pid" || failed=1; done
            exit "$failed"
          fi
          .build/release/FateSimulation 10000 --policy "$POLICY_GROUP" --output "$output/simulation-$POLICY_GROUP.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-simulations-${{ matrix.group }}
          path: artifacts/native-simulations/simulation-*.json
          if-no-files-found: error
